<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מחשבון תעריפי רכב</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap">
<style>
:root{--bg:#eceff1;--card:#fff;--ink:#192127;--mut:#5b6872;--line:#d6dde2;--meter:#1d252b;--meter-ink:#e8edf0;--glow:#f5c518;--acc:#1d252b;--soft:#fbefb8;--soft-ink:#5a4600;--warn:#ffb39c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1316;--card:#171d22;--ink:#e6ebee;--mut:#93a0a9;--line:#28323a;--meter:#080b0d;--acc:#f5c518;--soft:#3a3210;--soft-ink:#f5d95c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1316;--card:#171d22;--ink:#e6ebee;--mut:#93a0a9;--line:#28323a;--meter:#080b0d;--acc:#f5c518;--soft:#3a3210;--soft-ink:#f5d95c;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Rubik,system-ui,-apple-system,"Segoe UI","Arial Hebrew",Arial,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:26px;font-weight:700;margin:0 0 4px}
.sub{margin:0 0 18px;color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;font-weight:500;color:var(--mut);margin:0 0 6px}
input{width:100%;min-height:46px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font:inherit;font-size:13px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip:hover{border-color:var(--acc)}
.meter{background:var(--meter);color:var(--meter-ink);border-radius:20px;padding:20px 18px 12px;margin-bottom:6px}
.meter .nm{font-size:14px;opacity:.8}
.tot{font-size:58px;line-height:1.1;font-weight:700;color:var(--glow);font-variant-numeric:tabular-nums;margin:6px 0 12px}
.tot span{font-size:28px;margin-inline-start:8px}
.ln{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-top:1px solid rgba(255,255,255,.14);font-variant-numeric:tabular-nums}
.ln small{display:block;font-size:12.5px;opacity:.7}
.ln b{font-weight:500;white-space:nowrap}
.err{color:var(--warn);font-size:15px;padding-bottom:10px}
h2{font-size:15px;font-weight:700;margin:22px 2px 10px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:start;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.row[aria-pressed="true"]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.row .m{flex:1;min-width:0}
.row b{display:block;font-weight:500}
.row small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
.row .p{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;background:var(--soft);color:var(--soft-ink);font-size:11.5px;font-weight:500;border-radius:6px;padding:1px 7px;margin-inline-start:6px}
.foot{color:var(--mut);font-size:12.5px;margin:16px 2px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>מחשבון תעריפי רכב</h1>
  <p class="sub">בחר זמן ומרחק וראה כמה כל תעריף עולה.</p>

  <section class="card">
    <div class="g2">
      <div><label for="s">התחלה</label><input id="s" type="datetime-local"></div>
      <div><label for="e">סיום</label><input id="e" type="datetime-local"></div>
    </div>
    <div class="chips" id="dur" aria-label="משך נסיעה"></div>
    <div style="margin-top:16px"><label for="km">מרחק בק״מ</label><input id="km" type="number" inputmode="decimal" min="0" step="1" value="20"></div>
    <div class="chips" id="kms" aria-label="מרחק מהיר"></div>
  </section>

  <section class="meter" id="hero" aria-live="polite"></section>

  <h2>כל התעריפים, מהזול ליקר</h2>
  <div id="list"></div>
  <p class="foot">החישוב מניח שהמחיר בטבלה הוא ₪ לשעה, מחושב לפי דקות, והמרחק מחויב לפי ק״מ.</p>
</div>

<script>
const T=[
{n:'תעריף כולם הצריף של סיוי ובוסתן',km:0,s:[[0,24,0]]},
{n:'ענף על עגלה נגררת',km:0,s:[[0,6,0],[6,21,3],[21,24,0]]},
{n:'חבר על קלאבקר',since:'01/04/2021',km:0,s:[[0,24,4]]},
{n:'חבר על רכב סידור קטן',since:'08/2022',km:0.62,s:[[0,6,0],[6,21,4],[21,24,0]]},
{n:'חבר על רכב סידור גדול',since:'08/2022',km:0.62,s:[[0,6,0],[6,21,8],[21,24,0]]},
{n:'חבר על עגלה נגררת',km:0,s:[[0,6,0],[6,21,3],[21,24,0]]},
{n:'ענף ותושב על סידור קטן',since:'10/2026',km:0.89,s:[[0,6,0],[6,21,9.1],[21,24,0]]},
{n:'ענף ותושב על סידור גדול',since:'10/2026',km:0.89,s:[[0,6,0],[6,21,12.94],[21,24,0]]}
];
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const num=r=>String(+r.toFixed(2));
const money=n=>n.toFixed(2)+' ₪';
const hh=h=>pad(h)+':00';
const loc=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const dur=m=>{const h=Math.floor(m/60),r=m%60;return [h?h+' שע׳':'',r?r+' דק׳':''].filter(Boolean).join(' ')||'0 דק׳'};
const desc=t=>{
  const rs=[...new Set(t.s.map(x=>x[2]).filter(Boolean))];
  const parts=[];
  if(rs.length)parts.push(rs.map(num).join(' / ')+' ₪ לשעה');
  if(t.km)parts.push(num(t.km)+' ₪ לק״מ');
  return parts.join(' + ')||'ללא עלות';
};

let sel=0;
try{const v=parseInt(localStorage.getItem('tariff'),10);if(v>=0&&v<T.length)sel=v}catch(e){}

function calc(t,st,en,km){
  const mins=Math.round((en-st)/6e4),per=t.s.map(()=>0);
  for(let i=0;i<mins;i++){
    const d=new Date(st+i*6e4),h=d.getHours()+d.getMinutes()/60;
    const k=t.s.findIndex(x=>h>=x[0]&&h<x[1]);
    if(k>=0)per[k]++;
  }
  const g=new Map();
  t.s.forEach((x,i)=>{
    if(!per[i])return;
    const o=g.get(x[2])||{r:x[2],m:0,rg:[]};
    o.m+=per[i];o.rg.push(hh(x[0])+'–'+hh(x[1]));g.set(x[2],o);
  });
  const parts=[...g.values()].map(o=>({...o,c:o.m/60*o.r}));
  const kc=km*t.km;
  return{parts,kc,mins,total:parts.reduce((a,p)=>a+p.c,0)+kc};
}

function render(){
  const st=Date.parse($('s').value),en=Date.parse($('e').value);
  const km=Math.max(0,parseFloat($('km').value)||0);
  if(isNaN(st)||isNaN(en)||en<=st||en-st>26784e5){
    $('hero').innerHTML='<div class="err">הסיום חייב להיות אחרי ההתחלה, ועד 31 ימים.</div>';
    $('list').innerHTML='';return;
  }
  const rs=T.map((t,i)=>({t,i,...calc(t,st,en,km)})).sort((a,b)=>a.total-b.total||a.i-b.i);
  const c=rs.find(r=>r.i===sel);
  $('hero').innerHTML=
    `<div class="nm">${c.t.n}</div><div class="tot">${c.total.toFixed(2)}<span>₪</span></div>`+
    c.parts.map(p=>`<div class="ln"><span>${p.rg.join(', ')}<small>${dur(p.m)}${p.r?' × '+num(p.r)+' ₪ לשעה':', חינם'}</small></span><b>${money(p.c)}</b></div>`).join('')+
    `<div class="ln"><span>מרחק<small>${num(km)} ק״מ${c.t.km?' × '+num(c.t.km)+' ₪':', חינם'}</small></span><b>${money(c.kc)}</b></div>`+
    `<div class="ln"><span>משך כולל</span><b>${dur(c.mins)}</b></div>`;
  $('list').innerHTML=rs.map(r=>
    `<button class="row" type="button" data-i="${r.i}" aria-pressed="${r.i===sel}"><span class="m"><b>${r.t.n}${r.t.since?`<span class="tag">מ־${r.t.since}</span>`:''}</b><small>${desc(r.t)}</small></span><span class="p">${money(r.total)}</span></button>`
  ).join('');
}

$('dur').innerHTML=[[0.5,'30 דק׳'],[1,'שעה'],[2,'שעתיים'],[4,'4 שעות'],[8,'8 שעות'],[24,'יממה']]
  .map(([h,l])=>`<button class="chip" type="button" data-h="${h}">${l}</button>`).join('');
$('kms').innerHTML=[10,25,50,100,200]
  .map(k=>`<button class="chip" type="button" data-k="${k}">${k} ק״מ</button>`).join('');

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.h){
    const st=Date.parse($('s').value);
    if(!isNaN(st))$('e').value=loc(new Date(st+b.dataset.h*36e5));
  }else if(b.dataset.k){
    $('km').value=b.dataset.k;
  }else if(b.dataset.i){
    sel=+b.dataset.i;
    try{localStorage.setItem('tariff',String(sel))}catch(err){}
  }else return;
  render();
});
['s','e','km'].forEach(id=>{$(id).addEventListener('input',render);$(id).addEventListener('change',render)});

const n=new Date();n.setSeconds(0,0);n.setMinutes(n.getMinutes()<30?30:60);
$('s').value=loc(n);
$('e').value=loc(new Date(+n+2*36e5));
render();
</script>
</body>
</html>
